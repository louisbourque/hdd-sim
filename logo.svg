<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">

  <defs>
    <!-- Grey chassis -->
    <linearGradient id="bodyGrey" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#b8bcc2"/>
      <stop offset="1" stop-color="#8b9096"/>
    </linearGradient>

    <!-- Darker platter -->
    <radialGradient id="darkPlatter" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#55585c"/>
      <stop offset="0.5" stop-color="#3d3f43"/>
      <stop offset="1" stop-color="#1f2023"/>
    </radialGradient>

    <linearGradient id="armGrad" x1="0" x2="1">
      <stop offset="0" stop-color="#dfe4e8"/>
      <stop offset="1" stop-color="#9aa1a6"/>
    </linearGradient>

    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- TALLER drive body -->
  <g filter="url(#shadow)">
    <rect
      x="212"
      y="112"
      width="600"
      height="800"
      rx="70"
      ry="70"
      fill="url(#bodyGrey)"
    />
  </g>

  <!-- dark platter -->
  <g transform="translate(512,512)">
    <circle r="220" fill="#151618"/>
    <circle r="190" fill="url(#darkPlatter)"/>

    <!-- grooves -->
    <g opacity="0.14" stroke="#000" stroke-width="2" fill="none">
      <circle r="160"/>
      <circle r="140"/>
      <circle r="120"/>
      <circle r="100"/>
      <circle r="80"/>
      <circle r="60"/>
    </g>

    <!-- spindle -->
    <circle r="26" fill="#d0d0d0"/>
    <circle r="12" fill="#2c2c2c"/>
  </g>

  <!-- read/write arm -->
  <g transform="translate(512,512) rotate(-32)">
    <path d="M-20 -180 L 150 -90 L 240 -70"
          stroke="url(#armGrad)"
          stroke-width="22"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"/>
    <rect x="228" y="-78" width="34" height="20" rx="4" ry="4" fill="#1c1e21"/>
    <rect x="232" y="-72" width="22" height="6" rx="3" ry="3" fill="#e5e7ea"/>
  </g>

  <!-- LED (green now) -->
  <circle cx="740" cy="200" r="22" fill="#00c851"/>

</svg>
