[package]
name = "hdd-simulator"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = "0.7.0"
ksni = { version = "0.3.6", features = ["blocking"] }
smol = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
dirs = "6.0.0"
toml = "0.8"
rodio = "0.17"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"] }

[dev-dependencies]
tempfile = "3.10"
