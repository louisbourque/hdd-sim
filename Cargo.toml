[package]
name = "hdd-simulator"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[dependencies]
gdk4 = "^0"
gio = "^0"
glib = "^0"
dirs = "6.0.0"
regex = "1"
crossbeam-utils = "0.8.21"
gtk = { version = "0.10.0", package = "gtk4", features = ["v4_14"] }

[dependencies.adw]
package = "libadwaita"
version = "0.8.0"
features = ["v1_4"]
